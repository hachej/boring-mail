# bm-check-env-ci-yrt — no sibling checkout, no machine-specific env vars.
name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # version read from package.json packageManager field

      - uses: actions/setup-node@v4
        with:
          node-version: '22.22'
          cache: pnpm

      - name: Install (frozen lockfile, no sibling checkout)
        run: pnpm install --frozen-lockfile

      - name: check-env
        run: pnpm check-env

      - name: env tests
        run: node --test scripts/__tests__/checkEnv.test.mjs

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
